services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  api:
    build: .
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 4000
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - redis

volumes:
  redis_data:
